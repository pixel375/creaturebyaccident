name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CreatureByAccident-v0.1.0-debug.apk

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: CreatureByAccident-v0.1.0-debug
          path: CreatureByAccident-v0.1.0-debug.apk
          if-no-files-found: error

      - name: Publish v0.1.0 prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: Creature by Accident v0.1.0
          prerelease: true
          generate_release_notes: true
          files: CreatureByAccident-v0.1.0-debug.apk
